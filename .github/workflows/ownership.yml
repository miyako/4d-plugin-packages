name: Native ownership

on:
  push:
    branches: [master, miyako-packages-ownership-audit]
    paths:
      - '4D Plugin API/**'
      - '4DPlugin.cpp'
      - '4DPlugin.h'
      - '.github/tests/ownership*'
      - '.github/tests/test_ownership.py'
      - '.github/workflows/ownership.yml'
  pull_request:
    paths:
      - '4D Plugin API/**'
      - '4DPlugin.cpp'
      - '4DPlugin.h'
      - '.github/tests/ownership*'
      - '.github/tests/test_ownership.py'
      - '.github/workflows/ownership.yml'

permissions:
  contents: read

jobs:
  ownership:
    name: Unsigned ownership ASan UBSan
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual sources and complete SDK with synthetic platform boundaries
        run: python3 .github/tests/test_ownership.py -v
